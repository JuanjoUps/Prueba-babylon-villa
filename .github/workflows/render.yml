name: V3 - Campo realista y camiseta animada

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render
        run: node render.js

      - name: MP4
        run: |
          ffmpeg -y -i recording.webm \
            -vf "fps=30,scale=1080:1920:flags=lanczos" \
            -c:v libx264 -preset medium -crf 19 \
            -pix_fmt yuv420p -movflags +faststart \
            villa-v3-campo-camiseta.mp4

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: villa-v3-campo-camiseta
          path: villa-v3-campo-camiseta.mp4
