name: V4 Blender - Estadio 3D real

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Blender, FFmpeg y librerías gráficas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            blender \
            ffmpeg \
            libegl1 \
            libgl1 \
            libglu1-mesa \
            libx11-6 \
            libxext6 \
            libxi6 \
            libxrender1 \
            libxfixes3 \
            libxkbcommon0

      - name: Mostrar versión de Blender
        run: blender --version

      - name: Renderizar escena Blender
        run: |
          blender --background --python scene.py

      - name: Comprobar que se ha generado el vídeo
        run: |
          test -f villa-v4-preview.mp4
          ls -lh villa-v4-preview.mp4

      - name: Renombrar vídeo
        run: |
          mv villa-v4-preview.mp4 villa-v4-estadio-3d.mp4

      - name: Guardar vídeo
        uses: actions/upload-artifact@v4
        with:
          name: villa-v4-estadio-3d
          path: villa-v4-estadio-3d.mp4

      - name: Guardar archivo Blender
        uses: actions/upload-artifact@v4
        with:
          name: villa-v4-blend
          path: villa-v4.blend
