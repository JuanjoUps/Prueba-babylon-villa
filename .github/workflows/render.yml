name: Prueba estadio 3D profesional V2

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Renderizar escena 3D
        run: node render.js

      - name: Crear MP4 vertical
        run: |
          ffmpeg -y -i recording.webm \
            -vf "fps=30,scale=1080:1920:flags=lanczos" \
            -c:v libx264 -preset medium -crf 20 \
            -pix_fmt yuv420p -movflags +faststart \
            villa-estadio-3d-v2.mp4

      - name: Subir vídeo
        uses: actions/upload-artifact@v4
        with:
          name: villa-estadio-3d-v2
          path: villa-estadio-3d-v2.mp4
          if-no-files-found: error
