<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>Villa de Buitrago — Prueba V3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scene">
  <div class="stadium-glow"></div>
  <div class="stands stands-top"></div>
  <div class="stands stands-bottom"></div>
  <div class="light light-a"></div><div class="light light-b"></div>
  <div class="light light-c"></div><div class="light light-d"></div>

  <div class="title">
    <div class="eyebrow">C.D. VILLA DE BUITRAGO</div>
    <h1>ALINEACIÓN TITULAR</h1>
    <div class="sub">PRUEBA DE ANIMACIÓN · ESCENA 3D/2.5D</div>
  </div>

  <div class="pitch">
    <div class="pitch-lines"></div>
    <div class="center-circle"></div>
    <div class="center-dot"></div>
    <div class="box top-box"></div><div class="box bottom-box"></div>
    <div class="goal top-goal"></div><div class="goal bottom-goal"></div>
    <div class="grass-noise"></div>

    <div class="jersey-stage">
      <div class="jersey-shadow"></div>
      <div class="jersey" id="jersey">
        <svg viewBox="0 0 500 600" aria-label="Camiseta Villa de Buitrago">
          <defs>
            <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="#073f20"/>
              <stop offset=".28" stop-color="#159447"/>
              <stop offset=".55" stop-color="#087b38"/>
              <stop offset=".82" stop-color="#064b27"/>
              <stop offset="1" stop-color="#022b18"/>
            </linearGradient>
            <linearGradient id="gold" x1="0" x2="1">
              <stop stop-color="#fff09b"/><stop offset=".35" stop-color="#e9bd2d"/>
              <stop offset=".7" stop-color="#fff09b"/><stop offset="1" stop-color="#b9870d"/>
            </linearGradient>
            <filter id="shadow"><feGaussianBlur stdDeviation="13"/></filter>
            <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
            <pattern id="fabric" width="12" height="12" patternUnits="userSpaceOnUse">
              <path d="M0 2H12 M0 8H12" stroke="#fff" stroke-opacity=".035" stroke-width="1"/>
              <path d="M2 0V12 M8 0V12" stroke="#000" stroke-opacity=".04" stroke-width="1"/>
            </pattern>
          </defs>
          <path d="M145 72 L190 35 Q250 15 310 35 L355 72 L458 125 L420 245 L350 210 L350 535 Q250 570 150 535 L150 210 L80 245 L42 125 Z"
                fill="#000" opacity=".35" transform="translate(7 13)" filter="url(#shadow)"/>
          <path d="M145 72 L190 35 Q250 15 310 35 L355 72 L458 125 L420 245 L350 210 L350 535 Q250 570 150 535 L150 210 L80 245 L42 125 Z"
                fill="url(#green)" stroke="#031d10" stroke-width="8"/>
          <path d="M145 72 L190 35 Q250 15 310 35 L355 72 L458 125 L420 245 L350 210 L350 535 Q250 570 150 535 L150 210 L80 245 L42 125 Z"
                fill="url(#fabric)"/>
          <path d="M190 35 Q250 72 310 35" fill="none" stroke="#050b08" stroke-width="18"/>
          <path d="M194 38 Q250 67 306 38" fill="none" stroke="url(#gold)" stroke-width="5"/>
          <path d="M83 126 L125 102 L153 188 L82 230" fill="#0a5a2d" stroke="#0a2416" stroke-width="6"/>
          <path d="M417 126 L375 102 L347 188 L418 230" fill="#0a5a2d" stroke="#0a2416" stroke-width="6"/>
          <path d="M154 206 Q250 226 346 206" fill="none" stroke="#8ed66b" stroke-opacity=".18" stroke-width="4"/>
          <path d="M150 535 Q250 570 350 535" fill="none" stroke="#c89d20" stroke-width="7"/>
          <!-- simple club badge -->
          <path d="M213 91 Q250 73 287 91 L279 137 Q250 164 221 137Z" fill="#e7bf32" stroke="#111" stroke-width="5"/>
          <circle cx="250" cy="99" r="11" fill="#fff"/>
          <path d="M230 123 Q250 101 270 123 Q250 145 230 123" fill="#155d2e"/>
          <text x="250" y="132" text-anchor="middle" font-family="Arial" font-size="10" font-weight="900" fill="#111">VILLA</text>
          <!-- dorsal -->
          <text x="250" y="315" text-anchor="middle" font-family="Arial Black,Arial" font-size="142" font-weight="900"
                fill="#f5c934" stroke="#1a3d24" stroke-width="7" paint-order="stroke">10</text>
          <text x="250" y="373" text-anchor="middle" font-family="Arial" font-size="28" font-weight="900"
                fill="#fff" letter-spacing="3">JUANITO</text>
          <!-- fabric highlights -->
          <path d="M112 143 Q145 115 175 105" stroke="#fff" stroke-opacity=".17" stroke-width="8" fill="none" filter="url(#soft)"/>
          <path d="M330 95 Q365 112 397 145" stroke="#fff" stroke-opacity=".10" stroke-width="9" fill="none" filter="url(#soft)"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="caption">
    <div class="caption-title">10 · JUANITO</div>
    <div class="caption-sub">LA CAMISETA ENTRA EN ESCENA</div>
  </div>
</div>
<script src="scene.js"></script>
</body>
</html>
